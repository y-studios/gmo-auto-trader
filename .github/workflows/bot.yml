name: Trading bot (every 15 min)

# 有効化手順:
#   gh secret set GMO_API_KEY --repo y-studios/gmo-auto-trader --body '...'
#   gh secret set GMO_API_SECRET --repo y-studios/gmo-auto-trader --body '...'
#   gh variable set BOT_ENABLED --repo y-studios/gmo-auto-trader --body true      # これが true のときだけ動く
#   gh variable set LIVE_TRADING --repo y-studios/gmo-auto-trader --body false    # true で実弾（成行発注）
# 停止: gh variable set BOT_ENABLED --body false  または  workflow_dispatch で mode=emergency

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | check | emergency | resume"
        required: false
        default: "run"

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bot
        env:
          GMO_API_KEY: ${{ secrets.GMO_API_KEY }}
          GMO_API_SECRET: ${{ secrets.GMO_API_SECRET }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            check) node scripts/bot.mjs --check ;;
            emergency) node scripts/bot.mjs --emergency ;;
            resume) node scripts/bot.mjs --resume ;;
            *) node scripts/bot.mjs ;;
          esac
      - name: Commit state
        id: commit
        run: |
          git config user.name "gmo-auto-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "bot: update state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN での push は他のワークフローを起動しないので、Pages デプロイを明示的に叩く
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
