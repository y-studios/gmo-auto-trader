name: Deploy to Cloudflare Pages

# Cloudflare Access で保護された gmo-auto-trader.pages.dev（本人のメールアドレスのみ許可）に
# 静的ビルドをデプロイする。GitHub Pages は 2026-08-20 に無効化済み（誰でも閲覧できてしまうため）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://gmo-auto-trader.pages.dev"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=gmo-auto-trader --commit-dirty=true
